<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f10">
<title>GYM LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0d0f10; --surface:#16191b; --surface-2:#1e2225; --line:#2a2f33;
  --text:#f2f3ee; --muted:#8b9096; --accent:#c8ff4d; --accent-dim:#8faf3a;
  --danger:#ff6b5e; --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
::selection{background:var(--accent);color:#0d0f10}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:640px;margin:auto;padding:0 18px 110px}

/* header */
header.top{padding:18px 0 10px;display:flex;justify-content:space-between;align-items:flex-end}
h1{margin:0;font-family:'Bebas Neue',system-ui,sans-serif;font-size:36px;letter-spacing:.05em;line-height:1}
.sub{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
#hist{background:var(--surface);border:1px solid var(--line);color:var(--text);width:40px;height:40px;
  border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0}
#hist.active{background:var(--accent);color:#0d0f10;border-color:var(--accent)}
#gconnect{background:var(--surface);border:1px solid var(--line);color:var(--text);width:40px;height:40px;
  border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0}
#gconnect.connected{background:var(--accent);color:#0d0f10;border-color:var(--accent)}
#gconnect.syncing{animation:pulse 1s ease infinite}
#manage{background:var(--surface);border:1px solid var(--line);color:var(--text);width:40px;height:40px;
  border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0}
#manage.active{background:var(--accent);color:#0d0f10;border-color:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* volume bar - signature element */
.volume-wrap{padding-bottom:12px;margin-bottom:4px}
.sticky-top{position:sticky;top:0;z-index:5;background:var(--bg);padding:0 18px;margin:0 -18px;
  box-shadow:0 12px 16px -8px var(--bg)}
.volume-track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.volume-fill{height:100%;background:var(--accent);width:0%;transition:width .35s ease;border-radius:99px}
.volume-label{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--muted);margin-top:5px}
.volume-label b{color:var(--accent);font-weight:700}

/* controls */
.controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;overflow:hidden}
.grid{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid>div{min-width:0;max-width:100%}
.grid input{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
label{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:6px}
input,select{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 10px;text-align:center;font-family:'Inter',sans-serif;font-weight:600;
  font-size:14px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(50% + 32px) 50%,calc(50% + 37px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=date]{color-scheme:dark;-webkit-appearance:none;appearance:none;display:block}
input::placeholder{color:#565b60}

/* routine tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  border-radius:10px;padding:11px 6px;font-weight:700;font-size:13px;text-align:center;
  white-space:nowrap;font-family:'JetBrains Mono',monospace}
.tab.on{background:var(--accent);border-color:var(--accent);color:#0d0f10}

/* muscle group */
.group{display:flex;align-items:baseline;gap:10px;margin:22px 2px 10px}
.group .name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;color:var(--accent)}
.group .rule{flex:1;height:1px;background:var(--line)}

/* exercise card */
.exercise{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px}
.exercise-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.exercise-title span:first-child{font-weight:700;font-size:14.5px}
.unit-tag{font-size:10px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);
  border-radius:99px;padding:3px 9px;white-space:nowrap;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.unit-select{width:auto;background:var(--surface-2);border:1px solid var(--line);color:var(--accent);
  border-radius:99px;padding:4px 22px 4px 10px;font-size:11px;font-weight:700;text-align:center;
  font-family:'JetBrains Mono',monospace;background-position:calc(100% - 8px) 50%,calc(100% - 4px) 50%}

.series-head{display:grid;grid-template-columns:30px 1fr 1fr 22px;gap:8px;padding:0 2px 6px}
.series-head span{font-size:10px;color:var(--muted);text-align:center;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em}
.series{display:grid;grid-template-columns:30px 1fr 1fr 22px;gap:8px;align-items:center;margin-top:7px}
.series.weight-only,.series[data-shared="reps"],.series-head.weight-only{grid-template-columns:30px 1fr 22px}
.reps-block{border-color:var(--accent-dim);background:#161d10}
.reps-block .exercise-title span:first-child{color:var(--accent)}
.s{text-align:center;color:var(--muted);font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.series input{font-family:'JetBrains Mono',monospace;padding:10px 4px}
.series input.filled{border-color:var(--accent-dim);background:#1c2418}
.delta{font-size:10px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700}
.delta.up{color:var(--accent)}.delta.down{color:var(--danger)}.delta.same{color:var(--muted)}

/* empty state */
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px 16px;text-align:center;
  color:var(--muted);font-size:13px}

/* history panel */
.history{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;display:none}
.history b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  border-top:1px solid var(--line)}
.hist-row:first-of-type{border-top:none;margin-top:8px}
.hist-main{font-weight:700;font-size:13.5px}
.hist-sub{color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:2px}
.hist-del{background:transparent;color:var(--danger);border:1px solid #3a2422;border-radius:8px;
  padding:6px 10px;font-size:11px;font-weight:700}

/* manage exercises */
.manage-warn{font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin:10px 0}
.manage-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.manage-row:first-of-type{border-top:none}
.manage-row .mname{flex:1;font-size:13px;font-weight:600}
.manage-row .mgroup{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);width:28px;height:28px;
  border-radius:8px;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0}
.mbtn.del{color:var(--danger)}
.manage-add{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.manage-add input{text-align:left}

/* bottom bar */
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,16,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px;margin:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 14px;font-weight:700;font-size:14px}
.primary{background:var(--accent);color:#0d0f10}
.primary:active{transform:scale(.98)}
.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);opacity:0;
  background:var(--text);color:#0d0f10;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;
  transition:all .25s ease;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body><div class="app">

<div class="sticky-top">
<header class="top">
  <div><h1>GYM LOG</h1><div class="sub">Registro de entrenamiento</div></div>
  <div style="display:flex;gap:8px">
    <button id="gconnect" aria-label="Conectar Google Sheets">☁</button>
    <button id="manage" aria-label="Gestionar ejercicios">⚙</button>
    <button id="hist" aria-label="Ver historial">↺</button>
  </div>
</header>

<div class="volume-wrap">
  <div class="volume-track"><div class="volume-fill" id="volFill"></div></div>
  <div class="volume-label"><span>Sets completados</span><span><b id="volCount">0</b>/<span id="volTotal">0</span></span></div>
</div>
</div>

<div class="controls">
  <div class="grid">
    <div><label>Fecha</label><input id="date" type="date"></div>
    <div><label>Rutina</label>
      <select id="routine" style="display:none">
        <option value="A">Día A</option><option value="B">Día B</option><option value="C">Día C</option>
      </select>
      <div class="tabs" id="tabs">
        <div class="tab" data-r="A">DÍA A</div>
        <div class="tab" data-r="B">DÍA B</div>
        <div class="tab" data-r="C">DÍA C</div>
      </div>
    </div>
  </div>
</div>

<main id="workout"></main>

<div class="history" id="history">
  <b>Sesiones guardadas</b>
  <div id="historyList"></div>
</div>

<div class="history" id="manageBox">
  <b>Gestionar ejercicios · <span id="manageRoutineLabel">Día A</span></b>
  <div class="manage-warn">⚠ Si agregas, quitas o reordenas ejercicios, debes actualizar las columnas de Google Sheets en el mismo orden para que los datos no se desalineen.</div>
  <div id="manageList"></div>
  <div class="manage-add">
    <input id="newGroup" type="text" placeholder="Grupo muscular (ej. Pecho)">
    <input id="newExercise" type="text" placeholder="Nombre del ejercicio">
    <button class="secondary" id="addExercise">+ Agregar ejercicio</button>
  </div>
  <button class="secondary" id="copyHeaders" style="margin-top:10px;width:100%">Copiar encabezado para Sheets</button>
</div>

</div>

<div class="bottom">
  <button class="secondary" id="export">Exportar CSV</button>
  <button class="primary" id="save">Guardar sesión</button>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_R={
A:[["Pecho",["Press inclinado","Peck deck","Chest press"]],["Tríceps",["Extensión de tríceps","Press de tríceps"]],["Hombro",["Vuelos laterales","Vuelo frontal","Hombro trasero","Press militar"]]],
B:[["Espalda",["Jalón al pecho","Remo","Martillo"]],["Brazo",["Bícep"]],["Antebrazo",["Antebrazo"]]],
C:[["Pierna",["Abductor","Aductor","Leg curl","Leg extension","Prensa","Hip thrust"]]]
};
const EX_KEY="gymLog_exercises_v1";
function loadExercises(){
  try{
    let saved=JSON.parse(localStorage.getItem(EX_KEY));
    if(saved&&saved.A&&saved.B&&saved.C)return saved;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_R));
}
function saveExercises(){localStorage.setItem(EX_KEY,JSON.stringify(R))}
let R=loadExercises();
const units={}; const KEY="gymLog_v1"; const $=id=>document.getElementById(id);

// ---- Google Sheets sync ----
const GCFG={
  clientId:"530370071490-npuqigm1q6bjsfon8faq80b1n9t72btb.apps.googleusercontent.com",
  sheetId:"1stAEKsBkGniC7Y_zidEuWgNmSlK5-mQSu3iBc2iZcao",
  scope:"https://www.googleapis.com/auth/spreadsheets"
};
let gTokenClient=null, gAccessToken=null;

function sheetNameFor(routine){return "Registro_"+routine}

function exerciseListFor(routine){
  let list=[];
  (R[routine]||[]).forEach(g=>g[1].forEach(ex=>list.push(ex)));
  return list;
}

// convierte una sesión (registros por ejercicio/serie) al formato ancho:
// una fila por serie, con pares Peso/Reps por ejercicio en orden fijo
function buildWideRows(session){
  let list=exerciseListFor(session.routine);
  let bySerie={};
  (session.records||[]).forEach(r=>{(bySerie[r.serie]??={})[r.exercise]=r});
  let rows=[];
  for(let i=1;i<=4;i++){
    let row=[session.date,i];
    list.forEach(ex=>{
      let rec=bySerie[i]?.[ex];
      row.push(rec?rec.weight??"":"");
      row.push(rec?rec.reps??"":"");
      row.push(rec?rec.unit??"":"");
    });
    if(bySerie[i])rows.push(row);
  }
  return rows;
}

function initGoogle(){
  if(!window.google||!google.accounts){setTimeout(initGoogle,300);return}
  gTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GCFG.clientId,
    scope:GCFG.scope,
    callback:(resp)=>{
      if(resp.error){toast("No se pudo conectar con Google");return}
      gAccessToken=resp.access_token;
      sessionStorage.setItem("gToken",gAccessToken);
      $("gconnect").classList.add("connected");
      toast("Conectado a Google Sheets ✓");
    }
  });
  let saved=sessionStorage.getItem("gToken");
  if(saved){gAccessToken=saved;$("gconnect").classList.add("connected")}
}

$("gconnect").onclick=()=>{
  if(!gTokenClient){toast("Google aún está cargando, espera un segundo");return}
  gTokenClient.requestAccessToken({prompt:gAccessToken?"":"consent"});
};

async function syncToSheet(session){
  if(!gAccessToken)return; // no conectado, no bloquea el guardado local
  let rows=buildWideRows(session);
  if(!rows.length)return;
  let sheet=sheetNameFor(session.routine);
  $("gconnect").classList.add("syncing");
  try{
    let res=await fetch(
      "https://sheets.googleapis.com/v4/spreadsheets/"+GCFG.sheetId+"/values/"+encodeURIComponent(sheet)+"!A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS",
      {method:"POST",headers:{Authorization:"Bearer "+gAccessToken,"Content-Type":"application/json"},
       body:JSON.stringify({values:rows})}
    );
    if(res.status===401){
      // token expirado, pide uno nuevo
      gAccessToken=null;sessionStorage.removeItem("gToken");
      $("gconnect").classList.remove("connected");
      toast("Tu sesión de Google expiró, conéctate de nuevo");
    } else if(!res.ok){
      toast("Error al sincronizar con Sheets");
    } else {
      toast("Sesión guardada y sincronizada ✓");
    }
  }catch(e){
    toast("Sin conexión, se guardó solo en el dispositivo");
  }finally{
    $("gconnect").classList.remove("syncing");
  }
}

function sessions(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function saveSessions(s){localStorage.setItem(KEY,JSON.stringify(s))}
function prev(r){
  let x=sessions().filter(s=>s.routine==r).sort((a,b)=>b.date.localeCompare(a.date))[0],o={};
  if(x)(x.records||[]).forEach(v=>(o[v.exercise]??=[])[v.serie-1]=v);
  return o;
}
function lastUnit(p,ex){
  let arr=p[ex]||[];
  for(let i=arr.length-1;i>=0;i--){if(arr[i]&&arr[i].unit)return arr[i].unit}
  return "kg";
}

function toast(msg){let t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}

function setTab(r){$("routine").value=r;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.r===r))}

function render(){
  let r=$("routine").value,p=prev(r);$("workout").innerHTML="";
  let hasExercises=(R[r]||[]).some(g=>g[1].length);
  if(!hasExercises){$("workout").innerHTML='<div class="empty">No hay ejercicios definidos para esta rutina. Usa ⚙ para agregar algunos.</div>';updateVolume();return}

  R[r].forEach(g=>{
    if(!g[1].length)return;
    let sec=document.createElement("section");
    sec.innerHTML='<div class="group"><span class="name">'+g[0]+'</span><span class="rule"></span></div>';
    g[1].forEach(ex=>{
      let c=document.createElement("div");c.className="exercise";
      let u=lastUnit(p,ex);units[ex]=u;
      c.innerHTML='<div class="exercise-title"><span>'+ex+'</span>'
        +'<select class="unit-select" data-exercise="'+ex+'">'
        +'<option value="kg"'+(u==="kg"?" selected":"")+'>KG</option>'
        +'<option value="lb"'+(u==="lb"?" selected":"")+'>LB</option>'
        +'</select></div>'
        +'<div class="series-head"><span>SET</span><span>Reps</span><span>Peso</span><span></span></div>';
      for(let i=1;i<=4;i++){
        let v=p[ex]?.[i-1]||{};
        let row=document.createElement("div");row.className="series";
        row.dataset.exercise=ex;row.dataset.serie=i;
        let repsVal=(v.reps!==undefined&&v.reps!=="")?v.reps:8;
        let weightVal=(v.weight!==undefined&&v.weight!=="")?String(v.weight).replace(".",","):"";
        row.innerHTML='<div class="s">S'+i+'</div>'
          +'<input class="reps" type="number" inputmode="numeric" min="0" step="1" value="'+repsVal+'">'
          +'<input class="weight" type="text" inputmode="decimal" placeholder="—" value="'+weightVal+'">'
          +'<div class="delta"></div>';
        c.appendChild(row);
      }
      sec.appendChild(c);
    });
    $("workout").appendChild(sec);
  });
  document.querySelectorAll(".unit-select").forEach(sel=>{
    sel.addEventListener("change",()=>{units[sel.dataset.exercise]=sel.value});
  });
  document.querySelectorAll(".series input").forEach(inp=>{
    inp.classList.toggle("filled",inp.value!=="");
    inp.addEventListener("input",()=>{
      if(inp.classList.contains("weight")){
        inp.value=inp.value.replace(/[^0-9,.]/g,"").replace(/\.(?=.*\.)/g,"").replace(/,(?=.*,)/g,"");
      }
      inp.classList.add("touched");
      inp.classList.toggle("filled",inp.value!=="");updateVolume();
    });
  });
  updateVolume();
}

function updateVolume(){
  let rows=document.querySelectorAll(".series[data-exercise]");
  let total=rows.length,done=0;
  rows.forEach(row=>{
    let a=row.querySelector(".reps"),b=row.querySelector(".weight");
    if(a.classList.contains("touched")||b.classList.contains("touched"))done++;
  });
  $("volTotal").textContent=total;$("volCount").textContent=done;
  $("volFill").style.width=(total?Math.round(done/total*100):0)+"%";
}

function toNumber(str){
  if(str==="")return "";
  let n=parseFloat(String(str).replace(",","."));
  return isNaN(n)?"":n;
}

function collect(){
  let rec=[],date=$("date").value,routine=$("routine").value;
  document.querySelectorAll(".series[data-exercise]").forEach(row=>{
    let a=row.querySelector(".reps"),b=row.querySelector(".weight");
    if(a.value!==""||b.value!=="")rec.push({date,routine,exercise:row.dataset.exercise,serie:+row.dataset.serie,
      reps:a.value===""?"":+a.value,weight:toNumber(b.value),unit:units[row.dataset.exercise]||""});
  });
  return{date,routine,records:rec};
}

$("save").onclick=async()=>{
  let s=collect();
  if(!s.records.length){toast("No hay datos para guardar");return}
  let all=sessions().filter(x=>!(x.date==s.date&&x.routine==s.routine));
  all.push(s);saveSessions(all);
  toast("Sesión guardada ✓");
  await syncToSheet(s);
};

$("export").onclick=()=>{
  let rows=[["Fecha","Rutina","Serie","Ejercicio","Repeticiones","Peso","Unidad"]];
  sessions().forEach(s=>(s.records||[]).forEach(r=>rows.push([r.date,r.routine,r.serie,r.exercise,r.reps,r.weight,r.unit])));
  if(rows.length==1){toast("No hay sesiones guardadas");return}
  let csv="\ufeff"+rows.map(x=>x.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");
  let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="gym_log.csv";a.click();
};

function renderHistory(){
  let list=$("historyList"),s=sessions().sort((a,b)=>b.date.localeCompare(a.date));
  if(!s.length){list.innerHTML='<div class="empty">Aún no hay sesiones guardadas.</div>';return}
  list.innerHTML=s.map((x,i)=>
    '<div class="hist-row"><div><div class="hist-main">'+x.date+' · Día '+x.routine+'</div>'
    +'<div class="hist-sub">'+(x.records||[]).length+' registros</div></div>'
    +'<button class="hist-del" data-i="'+i+'">Borrar</button></div>'
  ).join("");
  list.querySelectorAll(".hist-del").forEach(btn=>{
    btn.onclick=()=>{
      let idx=+btn.dataset.i,sorted=sessions().sort((a,b)=>b.date.localeCompare(a.date));
      let target=sorted[idx];
      let all=sessions().filter(x=>!(x.date==target.date&&x.routine==target.routine));
      saveSessions(all);renderHistory();render();toast("Sesión eliminada");
    };
  });
}

$("hist").onclick=()=>{
  let h=$("history"),open=h.style.display==="block";
  h.style.display=open?"none":"block";
  $("hist").classList.toggle("active",!open);
  if(!open){$("manageBox").style.display="none";$("manage").classList.remove("active");renderHistory()}
};

// ---- gestión de ejercicios ----
function renderManage(){
  let r=$("routine").value;
  $("manageRoutineLabel").textContent="Día "+r;
  let list=$("manageList");list.innerHTML="";
  R[r].forEach((g,gi)=>{
    g[1].forEach((ex,ei)=>{
      let row=document.createElement("div");row.className="manage-row";
      row.innerHTML='<div><div class="mname">'+ex+'</div><div class="mgroup">'+g[0]+'</div></div>'
        +'<button class="mbtn" data-act="up" data-g="'+gi+'" data-e="'+ei+'">↑</button>'
        +'<button class="mbtn" data-act="down" data-g="'+gi+'" data-e="'+ei+'">↓</button>'
        +'<button class="mbtn del" data-act="del" data-g="'+gi+'" data-e="'+ei+'">🗑</button>';
      list.appendChild(row);
    });
  });
  if(!R[r].some(g=>g[1].length))list.innerHTML='<div class="empty">No hay ejercicios en esta rutina.</div>';
  list.querySelectorAll(".mbtn").forEach(btn=>{
    btn.onclick=()=>{
      let gi=+btn.dataset.g,ei=+btn.dataset.e,act=btn.dataset.act;
      let group=R[r][gi];
      if(act==="del"){
        if(!confirm('¿Eliminar "'+group[1][ei]+'"? Las sesiones ya guardadas con este ejercicio no se borran, pero dejará de aparecer en el formulario.'))return;
        group[1].splice(ei,1);
      } else if(act==="up"&&ei>0){
        [group[1][ei-1],group[1][ei]]=[group[1][ei],group[1][ei-1]];
      } else if(act==="down"&&ei<group[1].length-1){
        [group[1][ei+1],group[1][ei]]=[group[1][ei],group[1][ei+1]];
      }
      saveExercises();renderManage();render();
    };
  });
}

$("addExercise").onclick=()=>{
  let r=$("routine").value,gName=$("newGroup").value.trim(),exName=$("newExercise").value.trim();
  if(!exName){toast("Escribe el nombre del ejercicio");return}
  if(!gName){toast("Escribe el grupo muscular");return}
  let group=R[r].find(g=>g[0].toLowerCase()===gName.toLowerCase());
  if(!group){group=[gName,[]];R[r].push(group)}
  group[1].push(exName);
  saveExercises();
  $("newGroup").value="";$("newExercise").value="";
  renderManage();render();
  toast("Ejercicio agregado ✓");
};

$("copyHeaders").onclick=()=>{
  let r=$("routine").value;
  let cols=["Fecha","Serie"];
  exerciseListFor(r).forEach(ex=>{cols.push(ex+" - Peso");cols.push(ex+" - Reps");cols.push(ex+" - Unidad")});
  let text=cols.join("\t");
  navigator.clipboard?.writeText(text).then(()=>toast("Encabezado copiado — pégalo en A1 de Registro_"+r))
    .catch(()=>{prompt("Copia manualmente este encabezado:",text)});
};

$("manage").onclick=()=>{
  let box=$("manageBox"),open=box.style.display==="block";
  box.style.display=open?"none":"block";
  $("manage").classList.toggle("active",!open);
  if(!open){$("history").style.display="none";$("hist").classList.remove("active");renderManage()}
};

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{setTab(t.dataset.r);render();
  if($("manageBox").style.display==="block")renderManage();
});
$("date").onchange=render;

let d=new Date();d=new Date(d-d.getTimezoneOffset()*60000);
$("date").value=d.toISOString().slice(0,10);
setTab("A");render();
initGoogle();
</script>
